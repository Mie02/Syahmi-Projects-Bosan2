<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgRaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030612"/><stop offset="100%" stop-color="#09122c"/>
    </linearGradient>
    <filter id="glow_raft"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bgRaft)"/>
  <!-- 5-Node Pentagon Mesh -->
  <polygon points="320,70 430,140 390,240 250,240 210,140" fill="none" stroke="rgba(0,240,255,0.2)" stroke-width="2"/>
  <!-- Interconnected inner chords -->
  <line x1="320" y1="70" x2="390" y2="240" stroke="rgba(0,240,255,0.15)"/>
  <line x1="320" y1="70" x2="250" y2="240" stroke="rgba(0,240,255,0.15)"/>
  <line x1="430" y1="140" x2="210" y2="140" stroke="rgba(0,240,255,0.15)"/>
  
  <!-- Leader Node 1 -->
  <circle cx="320" cy="70" r="22" fill="#091838" stroke="#22d3a5" stroke-width="4" filter="url(#glow_raft)"/>
  <text x="320" y="75" fill="#fff" font-family="'Orbitron', monospace" font-size="12" font-weight="900" text-anchor="middle">👑</text>

  <!-- Follower Nodes -->
  <circle cx="430" cy="140" r="18" fill="#091838" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="390" cy="240" r="18" fill="#091838" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="250" cy="240" r="18" fill="#091838" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="210" cy="140" r="18" fill="#091838" stroke="#00f0ff" stroke-width="2"/>

  <rect x="180" y="295" width="280" height="38" rx="8" fill="rgba(8,12,20,0.9)" stroke="rgba(0,240,255,0.4)" stroke-width="1.5"/>
  <text x="320" y="319" fill="#22d3a5" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">DISTRIBUTED KV</text>
</svg>
