<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgShizuku" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816"/><stop offset="100%" stop-color="#0c1836"/>
    </linearGradient>
    <filter id="glow_shizuku"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bgShizuku)"/>
  <!-- Android Robot & Lightning IPC -->
  <g transform="translate(240, 60)" filter="url(#glow_shizuku)">
    <!-- Android Head -->
    <path d="M 30 70 A 50 50 0 0 1 130 70 Z" fill="#22d3a5"/>
    <circle cx="60" cy="45" r="5" fill="#040816"/>
    <circle cx="100" cy="45" r="5" fill="#040816"/>
    <line x1="45" y1="20" x2="35" y2="5" stroke="#22d3a5" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="20" x2="125" y2="5" stroke="#22d3a5" stroke-width="4" stroke-linecap="round"/>
    <!-- Lightning bolt -->
    <polygon points="85,65 60,115 80,115 70,165 110,105 90,105" fill="#00f0ff"/>
  </g>
  <rect x="180" y="295" width="280" height="38" rx="8" fill="rgba(8,12,20,0.9)" stroke="rgba(0,240,255,0.4)" stroke-width="1.5"/>
  <text x="320" y="319" fill="#22d3a5" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">SHIZUKU STUDIO</text>
</svg>
