<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040817"/>
      <stop offset="100%" stop-color="#0a122c"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bg-grad)"/>

  <!-- Grid lines -->
  <g stroke="rgba(0, 240, 255, 0.08)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="280" y1="0" x2="280" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
  </g>

  <!-- Radar Chart Polygon -->
  <g transform="translate(140, 120)">
    <!-- Concentric Web -->
    <polygon points="0,-70 66,-22 41,56 -41,56 -66,-22" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5"/>
    <polygon points="0,-45 42,-14 26,36 -26,36 -42,-14" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>
    <polygon points="0,-20 19,-6 12,16 -12,16 -19,-6" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1"/>

    <!-- Axis Rays -->
    <line x1="0" y1="0" x2="0" y2="-75" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="0" y1="0" x2="71" y2="-23" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="0" y1="0" x2="44" y2="60" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="0" y1="0" x2="-44" y2="60" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="0" y1="0" x2="-71" y2="-23" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Data Fill Polygon (Alpha & Constructs) -->
    <polygon points="0,-64 60,-18 36,48 -35,50 -58,-19" fill="rgba(0, 240, 255, 0.25)" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>

    <!-- Data Points -->
    <circle cx="0" cy="-64" r="4" fill="#00f0ff"/>
    <circle cx="60" cy="-18" r="4" fill="#22d3a5"/>
    <circle cx="36" cy="48" r="4" fill="#a855f7"/>
    <circle cx="-35" cy="50" r="4" fill="#f59e0b"/>
    <circle cx="-58" cy="-19" r="4" fill="#00f0ff"/>
  </g>

  <!-- Quill & Document Icon -->
  <g transform="translate(265, 65)">
    <!-- Document Card -->
    <rect x="0" y="0" width="80" height="110" rx="6" fill="#0c1630" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <line x1="15" y1="22" x2="65" y2="22" stroke="rgba(200, 220, 255, 0.6)" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="38" x2="55" y2="38" stroke="rgba(0, 240, 255, 0.6)" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="52" x2="65" y2="52" stroke="rgba(200, 220, 255, 0.3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="66" x2="45" y2="66" stroke="rgba(200, 220, 255, 0.3)" stroke-width="2" stroke-linecap="round"/>

    <!-- Badge APA 7 -->
    <rect x="15" y="80" width="50" height="18" rx="4" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
    <text x="40" y="93" font-family="'Orbitron', monospace" font-size="9" fill="#c084fc" font-weight="700" text-anchor="middle">APA 7.0</text>

    <!-- Glowing Quill Pin -->
    <path d="M 65,10 C 85,30 90,65 70,85 C 65,70 60,50 55,40 Z" fill="url(#cyan-glow)" filter="url(#glow)"/>
    <line x1="60" y1="65" x2="80" y2="105" stroke="#00f0ff" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <rect x="30" y="22" width="130" height="22" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
  <text x="95" y="37" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">PAPERFORGE</text>

  <!-- Stat Badge Bottom -->
  <rect x="30" y="195" width="220" height="26" rx="6" fill="#091024" stroke="rgba(34, 211, 165, 0.4)" stroke-width="1"/>
  <circle cx="45" cy="208" r="4" fill="#22d3a5"/>
  <text x="56" y="212" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ccd6f6">α = 0.942 | N = 35 VALIDATED</text>
</svg>
