<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgQC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612"/><stop offset="100%" stop-color="#0b102c"/>
    </linearGradient>
    <filter id="glow_qc"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bgQC)"/>
  <!-- Quantum Orbital Rings & Padlock -->
  <ellipse cx="320" cy="160" rx="140" ry="45" fill="none" stroke="#a855f7" stroke-width="2" transform="rotate(-25 320 160)"/>
  <ellipse cx="320" cy="160" rx="140" ry="45" fill="none" stroke="#00f0ff" stroke-width="2" transform="rotate(25 320 160)" filter="url(#glow_qc)"/>
  <!-- Center Quantum Lock Core -->
  <circle cx="320" cy="160" r="28" fill="#070b18" stroke="#00f0ff" stroke-width="3"/>
  <text x="320" y="167" fill="#22d3a5" font-family="'Orbitron', monospace" font-size="20" font-weight="900" text-anchor="middle">Ψ</text>

  <rect x="180" y="295" width="280" height="38" rx="8" fill="rgba(8,12,20,0.9)" stroke="rgba(0,240,255,0.4)" stroke-width="1.5"/>
  <text x="320" y="319" fill="#a855f7" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">QUANTUM CRYPTO</text>
</svg>
