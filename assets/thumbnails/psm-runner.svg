<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad_PSM Runner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <filter id="glow_PSM Runner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad_PSM Runner)"/>

  <!-- Grid lines -->
  <g stroke="rgba(0, 240, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Graphic Elements -->
  <g filter="url(#glow_PSM Runner)">
    <path d="M80 250 H560" stroke="#00f0ff" stroke-width="3"/>
           <rect x="160" y="195" width="36" height="55" rx="4" fill="#00f0ff"/>
           <rect x="180" y="205" width="16" height="8" rx="2" fill="#fff"/>
           <rect x="360" y="205" width="28" height="45" rx="4" fill="#ef4444"/>
           <rect x="460" y="165" width="28" height="85" rx="4" fill="#a855f7"/>
           <circle cx="280" cy="170" r="8" fill="#f59e0b"/>
  </g>

  <!-- Top Bracket & Category -->
  <rect x="28" y="26" width="70" height="24" rx="4" fill="rgba(0,240,255,0.12)" stroke="#00f0ff" stroke-width="1"/>
  <text x="63" y="42" font-family="'Orbitron', monospace, sans-serif" font-size="10" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="1">GAME</text>

  <!-- HUD Corner Accents -->
  <path d="M20 30 V20 H30 M610 20 H620 V30 M620 330 V340 H610 M30 340 H20 V330" stroke="rgba(0,240,255,0.4)" stroke-width="2" fill="none"/>

  <!-- Title & Subtitle overlay -->
  <text x="28" y="305" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">PSM Runner</text>
  <text x="28" y="326" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="rgba(204,214,246,0.65)" letter-spacing="1.5">PROCEDURAL 2D CANVAS GAME</text>
</svg>