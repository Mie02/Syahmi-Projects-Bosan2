<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad_ARStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#0c162d"/>
    </linearGradient>
    <filter id="glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow_emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad_ARStudio)"/>

  <!-- Blueprint Grid -->
  <g stroke="rgba(0, 240, 255, 0.06)" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Corridors & Path -->
  <g stroke="#334155" stroke-width="3" stroke-dasharray="6,6">
    <line x1="140" y1="240" x2="260" y2="240"/>
    <line x1="260" y1="240" x2="260" y2="130"/>
    <line x1="260" y1="240" x2="420" y2="240"/>
    <line x1="420" y1="240" x2="420" y2="120"/>
    <line x1="420" y1="240" x2="520" y2="240"/>
  </g>

  <!-- Glowing Active Route -->
  <path d="M 140 240 L 260 240 L 260 130 L 420 120" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow_cyan)"/>
  <path d="M 140 240 L 260 240 L 260 130 L 420 120" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10,6"/>

  <!-- Waypoints -->
  <!-- Start Waypoint -->
  <circle cx="140" cy="240" r="14" fill="#070b13" stroke="#10b981" stroke-width="4" filter="url(#glow_emerald)"/>
  <circle cx="140" cy="240" r="6" fill="#10b981"/>

  <!-- Junction Node -->
  <circle cx="260" cy="240" r="10" fill="#070b13" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="260" cy="240" r="4" fill="#38bdf8"/>

  <!-- Elevator / Transition Node -->
  <circle cx="260" cy="130" r="12" fill="#070b13" stroke="#a855f7" stroke-width="3"/>
  <circle cx="260" cy="130" r="5" fill="#a855f7"/>

  <!-- Destination Waypoint -->
  <circle cx="420" cy="120" r="16" fill="#070b13" stroke="#f43f5e" stroke-width="4"/>
  <circle cx="420" cy="120" r="7" fill="#f43f5e"/>

  <!-- Title Badge -->
  <rect x="180" y="285" width="280" height="38" rx="8" fill="rgba(8,12,20,0.9)" stroke="rgba(0,240,255,0.4)" stroke-width="1.5"/>
  <text x="320" y="309" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">INDOOR AR STUDIO</text>
</svg>
