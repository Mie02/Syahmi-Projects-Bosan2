<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgBatt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816"/><stop offset="100%" stop-color="#0b1634"/>
    </linearGradient>
    <filter id="glow_batt"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bgBatt)"/>
  <!-- Battery Outer Shell -->
  <rect x="220" y="100" width="180" height="100" rx="14" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#glow_batt)"/>
  <rect x="403" y="125" width="16" height="50" rx="5" fill="#00f0ff"/>
  <!-- Energy Fill Bar & Bolt -->
  <rect x="232" y="112" width="120" height="76" rx="8" fill="#22d3a5" opacity="0.85"/>
  <polygon points="310,118 290,150 305,150 295,182 325,145 310,145" fill="#ffffff"/>

  <rect x="180" y="295" width="280" height="38" rx="8" fill="rgba(8,12,20,0.9)" stroke="rgba(0,240,255,0.4)" stroke-width="1.5"/>
  <text x="320" y="319" fill="#22d3a5" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">BATTERY SENTINEL</text>
</svg>
