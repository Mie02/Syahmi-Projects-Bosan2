<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad_AudioScribe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040813"/>
      <stop offset="100%" stop-color="#0b1328"/>
    </linearGradient>
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow_audio" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad_AudioScribe)"/>

  <!-- Audio Studio Grid -->
  <g stroke="rgba(0, 240, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Equalizer Spectrum Bars -->
  <g fill="url(#eqGrad)">
    <rect x="90" y="200" width="12" height="40" rx="3"/>
    <rect x="110" y="170" width="12" height="70" rx="3"/>
    <rect x="130" y="150" width="12" height="90" rx="3"/>
    <rect x="150" y="120" width="12" height="120" rx="3"/>
    <rect x="170" y="100" width="12" height="140" rx="3"/>
    <rect x="190" y="80" width="12" height="160" rx="3"/>
    <rect x="210" y="130" width="12" height="110" rx="3"/>
    <rect x="230" y="160" width="12" height="80" rx="3"/>
    <rect x="250" y="110" width="12" height="130" rx="3"/>
    <rect x="270" y="70" width="12" height="170" rx="3"/>
    <rect x="290" y="60" width="12" height="180" rx="3"/>
    <rect x="310" y="50" width="12" height="190" rx="3"/>
    <rect x="330" y="65" width="12" height="175" rx="3"/>
    <rect x="350" y="90" width="12" height="150" rx="3"/>
    <rect x="370" y="120" width="12" height="120" rx="3"/>
    <rect x="390" y="140" width="12" height="100" rx="3"/>
    <rect x="410" y="100" width="12" height="140" rx="3"/>
    <rect x="430" y="75" width="12" height="165" rx="3"/>
    <rect x="450" y="110" width="12" height="130" rx="3"/>
    <rect x="470" y="150" width="12" height="90" rx="3"/>
    <rect x="490" y="180" width="12" height="60" rx="3"/>
    <rect x="510" y="195" width="12" height="45" rx="3"/>
    <rect x="530" y="210" width="12" height="30" rx="3"/>
  </g>

  <!-- Glowing Oscilloscope Sine Wave Overlay -->
  <path d="M 60 180 Q 140 100 220 180 T 380 180 T 540 180" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#glow_audio)"/>
  <path d="M 60 180 Q 140 100 220 180 T 380 180 T 540 180" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="180" y="280" width="280" height="38" rx="8" fill="rgba(8,12,20,0.9)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <text x="320" y="304" fill="#f59e0b" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">AUDIOSCRIBE STUDIO</text>
</svg>
