<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgOta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/><stop offset="100%" stop-color="#0c1936"/>
    </linearGradient>
    <filter id="glow_ota"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bgOta)"/>
  <!-- Broadcast Wave & Microchip -->
  <rect x="260" y="110" width="120" height="120" rx="14" fill="rgba(6,15,40,0.9)" stroke="#22d3a5" stroke-width="3" filter="url(#glow_ota)"/>
  <!-- Chip Pins -->
  <g stroke="#22d3a5" stroke-width="3">
    <line x1="280" y1="90" x2="280" y2="110"/><line x1="320" y1="90" x2="320" y2="110"/><line x1="360" y1="90" x2="360" y2="110"/>
    <line x1="280" y1="230" x2="280" y2="250"/><line x1="320" y1="230" x2="320" y2="250"/><line x1="360" y1="230" x2="360" y2="250"/>
  </g>
  <!-- Download arrow -->
  <path d="M 320 135 L 320 185 M 305 170 L 320 188 L 335 170" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="180" y="295" width="280" height="38" rx="8" fill="rgba(8,12,20,0.9)" stroke="rgba(0,240,255,0.4)" stroke-width="1.5"/>
  <text x="320" y="319" fill="#22d3a5" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">FIRMWARE OTA</text>
</svg>
