<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSM Cyber Runner — Endless Arcade Odyssey | Mie's Project Hub</title>
  <meta name="description" content="60 FPS Cyberpunk endless side-scroller with procedural Web Audio 8-bit sound effects, double jump, shield power-ups, and particle physics." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23050914' stroke='%2310b981' stroke-width='4'/><polygon points='26 18 46 32 26 46' fill='%2310b981'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #030611;
      --cyan: #00f0ff;
      --green: #10b981;
      --amber: #f59e0b;
      --purple: #a855f7;
      --red: #f43f5e;
      --text: #f8fafc;
      --font-display: 'Orbitron', monospace;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .hub-back {
      display: inline-flex; align-items: center; gap: 8px; position: fixed; top: 16px; left: 20px; z-index: 9999;
      padding: 7px 16px; background: rgba(3, 7, 18, 0.88); backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 240, 255, 0.35); border-radius: 8px; font-family: var(--font-display);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan);
      text-decoration: none; transition: all 0.2s;
    }
    .hub-back:hover { background: rgba(0, 240, 255, 0.2); color: #fff; transform: translateX(-2px); }

    /* Game Frame */
    .game-wrapper {
      position: relative;
      width: 900px;
      height: 480px;
      max-width: 96vw;
      border: 2px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
      background: #02050e;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Score & Telemetry Header */
    .game-hud {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .score-badge {
      background: rgba(4, 8, 20, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--cyan);
      backdrop-filter: blur(8px);
    }

    /* Overlay Screen (Start / Game Over) */
    .overlay-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 20;
    }

    .overlay-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      background: linear-gradient(90deg, #fff 0%, var(--cyan) 50%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .btn-play {
      padding: 12px 32px;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
      border: none;
      color: #02050f;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
    }

    /* Touch Controls for Mobile */
    .mobile-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: auto;
    }
    .touch-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.15);
      border: 2px solid rgba(0, 240, 255, 0.4);
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .touch-btn:active {
      background: rgba(0, 240, 255, 0.4);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <a href="../../index.html" class="hub-back">← Hub</a>

  <div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="game-hud">
      <div class="score-badge">SCORE: <span id="hudScore">0</span></div>
      <div class="score-badge" style="color: var(--amber);">HIGH: <span id="hudHighScore">0</span></div>
      <div class="score-badge" style="color: var(--green);">ENERGY: <span id="hudCoins">0</span></div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="overlayScreen" class="overlay-screen">
      <div class="overlay-title" id="overlayHeading">PSM CYBER RUNNER</div>
      <div style="font-size: 0.8rem; color: var(--cyan); font-family: var(--font-mono);" id="overlaySub">
        SPACEBAR / UP = JUMP (DOUBLE JUMP) • DOWN = SLIDE
      </div>
      <button class="btn-play" id="btnStartGame" onclick="startGame()">START RUN</button>
    </div>

    <!-- On-Screen Controls for Touch & Mouse -->
    <div class="mobile-controls">
      <div class="touch-btn" onmousedown="handleSlideDown()" onmouseup="handleSlideUp()" ontouchstart="handleSlideDown()" ontouchend="handleSlideUp()">SLIDE</div>
      <div class="touch-btn" onmousedown="handleJump()" ontouchstart="handleJump()">JUMP</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Audio SFX Synthesizer
    let audioCtx = null;
    function playSfx(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'jump') {
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'coin') {
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    // Game State
    let gameRunning = false;
    let score = 0;
    let highScore = Number(localStorage.getItem('psm_high_score') || 0);
    document.getElementById('hudHighScore').innerText = highScore;
    let coins = 0;
    let speed = 6;
    let particles = [];

    // Runner Object
    const runner = {
      x: 90,
      y: 340,
      w: 28,
      h: 48,
      vy: 0,
      gravity: 0.7,
      jumpForce: -13,
      jumpsLeft: 2,
      isSliding: false,
      hasShield: false,
      shieldTime: 0
    };

    let obstacles = [];
    let pickups = [];

    function startGame() {
      document.getElementById('overlayScreen').style.display = 'none';
      gameRunning = true;
      score = 0;
      coins = 0;
      speed = 6.5;
      runner.y = 340;
      runner.vy = 0;
      runner.jumpsLeft = 2;
      runner.isSliding = false;
      obstacles = [];
      pickups = [];
      particles = [];
      playSfx('jump');
    }

    function gameOver() {
      gameRunning = false;
      playSfx('crash');
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('psm_high_score', highScore);
        document.getElementById('hudHighScore').innerText = highScore;
      }
      document.getElementById('overlayHeading').innerText = 'MISSION FAILED';
      document.getElementById('overlaySub').innerText = `FINAL SCORE: ${score} • ENERGY ORBS: ${coins}`;
      document.getElementById('btnStartGame').innerText = 'RETRY MISSION';
      document.getElementById('overlayScreen').style.display = 'flex';
    }

    function handleJump() {
      if (!gameRunning) { startGame(); return; }
      if (runner.jumpsLeft > 0) {
        runner.vy = runner.jumpForce;
        runner.jumpsLeft--;
        runner.isSliding = false;
        playSfx('jump');

        // Particle sparks
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: runner.x + 14,
            y: runner.y + runner.h,
            vx: (Math.random() - 0.5) * 6 - speed,
            vy: Math.random() * 4,
            life: 20,
            color: '#00f0ff'
          });
        }
      }
    }

    function handleSlideDown() {
      if (runner.y >= 340) {
        runner.isSliding = true;
      }
    }
    function handleSlideUp() {
      runner.isSliding = false;
    }

    // Keyboard controls
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        handleJump();
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        e.preventDefault();
        handleSlideDown();
      }
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        handleSlideUp();
      }
    });

    // Main Game Loop (60 FPS)
    let lastSpawn = 0;
    function updateGame() {
      const w = canvas.width;
      const h = canvas.height;
      const groundY = 388;

      ctx.fillStyle = '#02050e';
      ctx.fillRect(0, 0, w, h);

      // Cyberpunk Parallax Background
      // Stars / City grid
      ctx.fillStyle = 'rgba(0, 240, 255, 0.05)';
      for (let i = 0; i < 30; i++) {
        const sx = ((i * 85 - (score * 0.4)) % w + w) % w;
        ctx.fillRect(sx, 40 + (i * 18) % 180, 2, 2);
      }

      // Distant Skyscrapers
      ctx.fillStyle = '#070f26';
      for (let i = 0; i < 12; i++) {
        const bx = ((i * 140 - (score * 0.8)) % (w + 140) + (w + 140)) % (w + 140) - 70;
        const bH = 120 + (i * 37) % 140;
        ctx.fillRect(bx, groundY - bH, 75, bH);
      }

      // Neon Ground Road
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(w, groundY);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Road Grid Hash lines
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
      ctx.lineWidth = 1;
      const hashOffset = (score * speed) % 40;
      for (let x = -hashOffset; x < w; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, groundY);
        ctx.lineTo(x - 20, h);
        ctx.stroke();
      }

      if (gameRunning) {
        score++;
        document.getElementById('hudScore').innerText = score;
        speed = 6.5 + Math.min(score / 500, 6.0); // gradual speed ramp

        // Physics
        runner.y += runner.vy;
        runner.vy += runner.gravity;

        // Ground landing
        const targetH = runner.isSliding ? 24 : 48;
        runner.h = targetH;
        if (runner.y + runner.h >= groundY) {
          runner.y = groundY - runner.h;
          runner.vy = 0;
          runner.jumpsLeft = 2;
        }

        // Spawn Obstacles & Coins
        if (score - lastSpawn > 80 + Math.random() * 50) {
          lastSpawn = score;
          const isHighLaser = Math.random() > 0.65;

          if (isHighLaser) {
            // High Laser (must slide under)
            obstacles.push({ x: w + 20, y: groundY - 48, w: 32, h: 22, type: 'laser' });
          } else {
            // Ground Barrier (must jump over)
            obstacles.push({ x: w + 20, y: groundY - 34, w: 24, h: 34, type: 'barrier' });
          }

          // Orbs
          if (Math.random() > 0.4) {
            pickups.push({ x: w + 80, y: isHighLaser ? groundY - 14 : groundY - 70, r: 8 });
          }
        }

        // Move Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= speed;

          // Hitbox collision check
          if (
            runner.x < obs.x + obs.w &&
            runner.x + runner.w > obs.x &&
            runner.y < obs.y + obs.h &&
            runner.y + runner.h > obs.y
          ) {
            gameOver();
            return;
          }

          if (obs.x + obs.w < -20) obstacles.splice(i, 1);
        }

        // Move Pickups
        for (let i = pickups.length - 1; i >= 0; i--) {
          const coin = pickups[i];
          coin.x -= speed;

          // Pickup collision check
          const dist = Math.hypot(runner.x + runner.w / 2 - coin.x, runner.y + runner.h / 2 - coin.y);
          if (dist < 26) {
            coins++;
            score += 50;
            document.getElementById('hudCoins').innerText = coins;
            playSfx('coin');
            pickups.splice(i, 1);
            continue;
          }

          if (coin.x < -20) pickups.splice(i, 1);
        }
      }

      // Draw Pickups (Glowing Energy Orbs)
      pickups.forEach(coin => {
        ctx.fillStyle = '#10b981';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Draw Obstacles
      obstacles.forEach(obs => {
        ctx.save();
        if (obs.type === 'laser') {
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 4;
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.moveTo(obs.x, obs.y);
          ctx.lineTo(obs.x + obs.w, obs.y);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#f59e0b';
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(obs.x, obs.y + obs.h);
          ctx.lineTo(obs.x + obs.w / 2, obs.y);
          ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
          ctx.fill();
        }
        ctx.restore();
      });

      // Draw Runner
      ctx.save();
      ctx.fillStyle = runner.isSliding ? '#a855f7' : '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.roundRect(runner.x, runner.y, runner.w, runner.h, 6);
      ctx.fill();

      // Cyber Visor Eye
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(runner.x + runner.w - 8, runner.y + 8, 6, 4);
      ctx.restore();

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
        if (p.life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(updateGame);
    }

    updateGame();
  </script>
</body>
</html>
